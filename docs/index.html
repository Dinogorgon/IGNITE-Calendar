<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IGNITE Events</title>
<meta name="description" content="Gainesville entrepreneurship and innovation events, collected in one calendar by IGNITE at UF.">
<meta name="theme-color" content="#2f4a7d">
<meta property="og:title" content="IGNITE · Gainesville Innovation Events">
<meta property="og:description" content="Every startup, entrepreneurship and innovation event in Gainesville, in one calendar.">
<meta property="og:image" content="https://gnvevents.peytondecker.me/logo.png">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<style>
  /* Brand colors from logo.png: navy star, orange star points, gold flame */
  :root {
    --navy: #2f4a7d; --navy-deep: #22375f; --orange: #e27c4b; --gold: #e7aa35;
    --bg: #f5f6f9; --panel: #ffffff; --ink: #18202f; --muted: #5d677a; --line: #e2e6ee;
    --accent: #d9692f; --accent-ink: #ffffff; --accent-soft: #fdf1e3;
    --primary: var(--navy); --primary-ink: #ffffff;
    --warn: #fff4d6; --warn-ink: #7a5300;
    --shadow: 0 1px 2px rgb(24 32 47 / .05), 0 8px 24px rgb(24 32 47 / .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1320; --panel: #151d2e; --ink: #edf0f6; --muted: #9aa5ba; --line: #263149;
      --accent: #ec8a55; --accent-ink: #1a0d05; --accent-soft: #2c2418;
      --primary: #ec8a55; --primary-ink: #1a0d05;
      --warn: #3a2f12; --warn-ink: #f5d27a;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .3);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  main.wrap { padding-top: 20px; padding-bottom: 48px; }

  /* Navy brand band with a flame-colored rule underneath */
  .topbar { background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%); color: #fff;
    border-bottom: 4px solid transparent; border-image: linear-gradient(90deg, var(--orange), var(--gold)) 1; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between; padding: 18px 0; }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .logo { width: 56px; height: 56px; flex: none; border-radius: 50%; background: #fff; padding: 5px;
    box-shadow: 0 2px 8px rgb(0 0 0 / .25); }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .kicker { font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
  h1 { font-size: 22px; margin: 0; line-height: 1.2; font-weight: 700; }
  .sub { color: rgb(255 255 255 / .72); font-size: 13px; margin-top: 2px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .btn { font: inherit; font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 8px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--muted); }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  button:disabled { opacity: .55; cursor: default; }
  .topbar button { background: rgb(255 255 255 / .1); border-color: rgb(255 255 255 / .25); color: #fff; }
  .topbar button:hover { background: rgb(255 255 255 / .18); border-color: rgb(255 255 255 / .5); }
  .topbar button.primary { background: var(--orange); border-color: var(--orange); color: #1a0d05; font-weight: 600; }
  .topbar button.primary:hover { background: #ec8a55; }

  @media (max-width: 600px) {
    .logo { width: 48px; height: 48px; }
    h1 { font-size: 19px; }
    .actions button { font-size: 13px; padding: 7px 11px; }
    .card { padding: 10px; }
    .fc .fc-toolbar { flex-wrap: wrap; gap: 8px; }
    .fc .fc-toolbar-title { font-size: 16px; }
    .fc .fc-list-table td { padding: 8px 8px; }
    .fc .fc-list-event-time { white-space: normal; width: 5.5em; }
  }

  .banner { background: var(--warn); color: var(--warn-ink); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { font-size: 13px; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .chip .dot { width: 10px; height: 10px; border-radius: 50%; }
  .chip.off { opacity: .4; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
  #log { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); margin: 0 0 12px; display: none; }

  /* FullCalendar theming */
  .fc { --fc-border-color: var(--line); --fc-page-bg-color: var(--panel); --fc-neutral-bg-color: var(--bg);
    --fc-list-event-hover-bg-color: var(--accent-soft); --fc-today-bg-color: color-mix(in srgb, var(--gold) 14%, transparent);
    --fc-button-bg-color: var(--panel); --fc-button-border-color: var(--line); --fc-button-text-color: var(--ink);
    --fc-button-hover-bg-color: var(--bg); --fc-button-hover-border-color: var(--muted);
    --fc-button-active-bg-color: var(--primary); --fc-button-active-border-color: var(--primary); }
  .fc .fc-button-primary:not(:disabled).fc-button-active { color: var(--primary-ink); }
  .fc .fc-toolbar-title { font-size: 18px; }
  .fc .fc-button { font-size: 13px; text-transform: none; box-shadow: none !important; }
  .fc-event { cursor: pointer; }
  .fc .fc-daygrid-event { white-space: normal; font-size: 12px; }
  .fc a { color: inherit; text-decoration: none; }
  .new-tag { background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }

  dialog { border: none; border-radius: 14px; padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
    background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  .dlg { padding: 20px 22px; }
  .dlg h2 { margin: 0 0 4px; font-size: 19px; line-height: 1.3; }
  .meta { display: grid; gap: 4px; margin: 12px 0; font-size: 14px; }
  .meta a { color: var(--accent); }
  .desc { font-size: 14px; color: var(--muted); white-space: pre-wrap; max-height: 160px; overflow: auto; border-left: 3px solid var(--line); padding-left: 12px; margin: 12px 0; }
  label.small { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  input[type=email] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 6px 0; }
  textarea { width: 100%; font: 14px/1.5 inherit; font-family: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; resize: vertical; margin: 6px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .hint { font-size: 13px; color: var(--muted); }
  code { background: var(--bg); padding: 2px 6px; border-radius: 4px; word-break: break-all; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><img src="logo.png" alt="IGNITE logo"></div>
      <div>
        <div class="kicker" id="kicker">IGNITE</div>
        <h1 id="calName">Gainesville Innovation Events</h1>
        <div class="sub" id="updated">Loading…</div>
      </div>
    </div>
    <div class="actions">
      <button id="digestBtn" class="admin-only" hidden title="Copy a Slack post covering the next two weeks">Copy 2‑week Slack digest</button>
      <button id="subscribeBtn">Add to Google Calendar</button>
      <button id="updateBtn" class="primary admin-only" hidden>Update now</button>
      <button id="loginBtn" hidden>Officer login</button>
      <button id="logoutBtn" hidden>Log out</button>
    </div>
  </header>
</div></div>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <pre id="log"></pre>
  <div class="chips" id="chips"></div>
  <div class="card"><div id="calendar"></div></div>
</main>

<dialog id="eventDlg"><div class="dlg" id="eventBody"></div></dialog>
<dialog id="subDlg"><div class="dlg" id="subBody"></div></dialog>
<dialog id="loginDlg"><form class="dlg" id="loginForm" method="dialog">
  <h2>Officer login</h2>
  <p class="hint">Enter your UF email. If it's on the officer list, we'll email you a login link.</p>
  <input id="loginEmail" type="email" required placeholder="you@ufl.edu" autocomplete="email">
  <p class="hint" id="loginMsg"></p>
  <div class="row"><button type="button" onclick="$('loginDlg').close()">Cancel</button>
    <button class="primary" id="loginSend" type="submit">Email me a link</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script>
const COLORS = ["#d0612b", "#3d63a8", "#b7861a", "#2f9e44", "#8e44ad", "#0c8599", "#c92a2a", "#a61e4d", "#5c940d", "#5f3dc4"];
let DATA = { meta: {}, events: [] };
let LOCAL = false;
let ADMIN = false;  // officer tools (Slack posts, updates) only after login
const hidden = new Set();
const orgColor = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); }
async function copy(text) { await navigator.clipboard.writeText(text); toast("Copied: paste it into Slack"); }

function colorFor(org) {
  if (!(org in orgColor)) orgColor[org] = COLORS[Object.keys(orgColor).length % COLORS.length];
  return orgColor[org];
}

function isNew(e) {
  const seen = new Date(e.first_seen), first = new Date(DATA.meta.first_run);
  return seen - first > 3600e3 && Date.now() - seen < 14 * 864e5;
}

function fmtWhen(e) {
  const s = new Date(e.start), end = e.end ? new Date(e.end) : null;
  const day = s.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
  if (e.all_day) return day;
  const t = (d) => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }).replace(":00", "");
  return end && end > s ? `${day} · ${t(s)}–${t(end)}` : `${day} · ${t(s)}`;
}

function slackText(e) {
  const pitch = e.blurb || (e.description || "").split("\n")[0].slice(0, 240);
  const lines = [`${e.title}  ·  ${e.org}`];
  if (pitch) lines.push(pitch);
  lines.push(`📅 ${fmtWhen(e)}`);
  if (e.location) lines.push(`📍 ${e.location}`);
  if (e.url) lines.push(`🔗 ${e.url}`);
  return lines.join("\n");
}

function gcalLink(e) {
  const z = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const s = new Date(e.start), end = e.end && new Date(e.end) > s ? new Date(e.end) : new Date(s.getTime() + 3600e3);
  const p = new URLSearchParams({ action: "TEMPLATE", text: e.title, dates: `${z(s)}/${z(end)}`,
    details: `${e.blurb || e.description || ""}\n\n${e.url || ""}`.slice(0, 1500), location: e.location || "" });
  return "https://calendar.google.com/calendar/render?" + p;
}

function openEvent(uid) {
  const e = DATA.events.find(x => x.uid === uid);
  const sources = e.sources.map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)).join(", ");
  $("eventBody").innerHTML = `
    <div class="chip" style="cursor:default"><span class="dot" style="background:${colorFor(e.org)}"></span>${esc(e.org)}</div>
    <h2 style="margin-top:10px">${esc(e.title)}${isNew(e) ? '<span class="new-tag">NEW</span>' : ""}</h2>
    <div class="meta">
      <div>📅 ${esc(fmtWhen(e))}</div>
      ${e.location ? `<div>📍 ${esc(e.location)}</div>` : ""}
      ${e.url ? `<div>🔗 <a href="${esc(e.url)}" target="_blank" rel="noopener">Event page / RSVP</a></div>` : ""}
      <div class="hint">Found on: ${sources}</div>
    </div>
    ${e.description ? `<div class="desc">${esc(e.description)}</div>` : ""}
    ${ADMIN ? `<label class="small" for="slackBox">Slack post ${e.blurb ? "" : "(no AI blurb yet, add a Gemini key)"}</label>
    <textarea id="slackBox" rows="7">${esc(slackText(e))}</textarea>` : ""}
    <div class="row">
      <a class="btn" href="${gcalLink(e)}" target="_blank" rel="noopener">Add this event to Google Calendar</a>
      <button onclick="$('eventDlg').close()">Close</button>
      ${ADMIN ? '<button class="primary" id="copyOne">Copy Slack post</button>' : ""}
    </div>`;
  if (ADMIN) $("copyOne").onclick = () => copy($("slackBox").value);
  $("eventDlg").showModal();
}

function digest() {
  const now = new Date(), until = new Date(now.getTime() + 14 * 864e5);
  const upcoming = DATA.events.filter(e => !hidden.has(e.org) && new Date(e.start) >= now && new Date(e.start) <= until);
  if (!upcoming.length) return toast("No events in the next two weeks");
  const day = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  copy(`Gainesville Events for ${day(now)} - ${day(until)}\n\n` + upcoming.map(slackText).join("\n\n"));
}

function renderChips() {
  const orgs = [...new Set(DATA.events.map(e => e.org))].sort();
  orgs.forEach(colorFor);
  $("chips").innerHTML = orgs.map(o =>
    `<span class="chip ${hidden.has(o) ? "off" : ""}" data-org="${esc(o)}"><span class="dot" style="background:${colorFor(o)}"></span>${esc(o)}</span>`).join("");
  $("chips").querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const o = c.dataset.org; hidden.has(o) ? hidden.delete(o) : hidden.add(o);
    renderChips(); calendar.refetchEvents();
  });
}

const calendar = new FullCalendar.Calendar($("calendar"), {
  initialView: window.innerWidth < 700 ? "upcoming" : "dayGridMonth",
  headerToolbar: { left: "prev,next today", center: "title", right: "dayGridMonth,upcoming" },
  views: { upcoming: { type: "list", duration: { days: 60 }, buttonText: "Upcoming list" } },
  buttonText: { month: "Month", today: "Today" },
  height: "auto", dayMaxEvents: 4, eventDisplay: "block",
  events: (info, ok) => ok(DATA.events.filter(e => !hidden.has(e.org)).map(e => ({
    id: e.uid, title: e.title, start: e.start, end: e.end || undefined, allDay: e.all_day,
    backgroundColor: colorFor(e.org), borderColor: colorFor(e.org), extendedProps: { e },
  }))),
  eventContent: (arg) => {
    const e = arg.event.extendedProps.e, isList = arg.view.type.startsWith("list");
    const time = arg.timeText && !isList ? `<b>${esc(arg.timeText)}</b> ` : "";
    const org = isList ? ` <span class="hint">· ${esc(e.org)}${e.location ? " · " + esc(e.location) : ""}</span>` : "";
    return { html: `${time}${esc(e.title)}${isNew(e) ? '<span class="new-tag">NEW</span>' : ""}${org}` };
  },
  eventClick: (arg) => { arg.jsEvent.preventDefault(); openEvent(arg.event.id); },
});

async function load() {
  DATA = await (await fetch("events.json?" + Date.now())).json();
  const m = DATA.meta;
  const [kicker, title] = (m.calendar_name || "Events").includes(" · ")
    ? m.calendar_name.split(" · ") : ["IGNITE", m.calendar_name || "Events"];
  $("kicker").textContent = kicker; $("calName").textContent = title;
  const upcoming = DATA.events.filter(e => new Date(e.start) >= new Date()).length;
  $("updated").textContent = `${upcoming} upcoming events · updated ${new Date(m.updated).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`;
  const b = $("banner");
  b.hidden = !(m.failed_sources || []).length;
  b.textContent = `Couldn't reach: ${(m.failed_sources || []).join(", ")}. Showing their events from the last successful update.`;
  renderChips(); calendar.refetchEvents();
}

async function hostedUpdate(btn) {
  btn.disabled = true; btn.textContent = "Starting update…";
  try {
    const r = await fetch("api/update", { method: "POST" });
    if (r.status === 401) { await setupAuth(); throw new Error("please log in again"); }
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    // GitHub runs update.py and commits, then Vercel redeploys. Watch for the new data.
    const before = DATA.meta.updated;
    btn.textContent = "Updating… (≈2–3 min)";
    for (let i = 0; i < 30; i++) {
      await new Promise(ok => setTimeout(ok, 15000));
      const m = (await (await fetch("events.json?" + Date.now())).json()).meta;
      if (m.updated !== before) { await load(); toast("Calendar updated"); break; }
      if (i === 29) toast("Still running: check back in a few minutes");
    }
  } catch (err) { toast("Update failed: " + err.message); }
  btn.disabled = false; btn.textContent = "Update now";
}

async function getJSON(url) {
  try { const r = await fetch(url, { cache: "no-store" }); return r.ok ? await r.json() : null; } catch { return null; }
}

// Viewers get a read-only calendar. Officer tools appear only when /api/session
// says you're logged in, and the server re-checks the login on every update.
async function setupAuth() {
  const mode = (await getJSON("api/status") || {}).mode;
  const session = mode ? await getJSON("api/session") : null;
  LOCAL = mode === "local";
  ADMIN = Boolean(session && session.admin);
  document.querySelectorAll(".admin-only").forEach(el => el.hidden = !ADMIN);
  $("loginBtn").hidden = ADMIN || mode !== "hosted";
  $("logoutBtn").hidden = !ADMIN || LOCAL;
  if (ADMIN) setupUpdate(mode);
}

$("loginBtn").onclick = () => { $("loginMsg").textContent = ""; $("loginDlg").showModal(); $("loginEmail").focus(); };
$("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = $("loginSend"); btn.disabled = true;
  try {
    const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("loginEmail").value }) });
    const data = await r.json();
    $("loginMsg").textContent = data.message || data.error;
  } catch { $("loginMsg").textContent = "Couldn't reach the server. Try again."; }
  btn.disabled = false;
});
$("logoutBtn").onclick = async () => {
  await fetch("api/logout", { method: "POST" });
  await setupAuth(); toast("Logged out");
};

function setupUpdate(mode) {
  const btn = $("updateBtn");
  if (mode === "hosted") {
    btn.onclick = () => hostedUpdate(btn);
  } else if (LOCAL) {
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "Updating… (≈1 min)";
      const log = $("log"); log.style.display = "none";
      try {
        const r = await (await fetch("api/update", { method: "POST" })).json();
        log.textContent = r.log; log.style.display = "block";
        await load(); toast("Calendar updated");
      } catch (err) { toast("Update failed: " + err); }
      btn.disabled = false; btn.textContent = "Update now";
    };
  } else if (DATA.meta.github_actions_url) {
    btn.onclick = () => window.open(DATA.meta.github_actions_url, "_blank");
    btn.title = "Opens GitHub Actions: click 'Run workflow'";
  } else {
    btn.disabled = true; btn.title = "Run the app with start.bat to enable updates";
  }
}

$("digestBtn").onclick = () => ADMIN && digest();
$("subscribeBtn").onclick = () => {
  const url = new URL("events.ics", location.href).href;
  $("subBody").innerHTML = LOCAL ? `
    <h2>Add these events to Google Calendar</h2>
    <p class="hint">Right now the calendar only runs on your computer, so Google can't auto-refresh it. You can:</p>
    <p><b>Import once:</b> download <a href="events.ics" download>events.ics</a>, then in Google Calendar go to
      <i>Settings → Import &amp; export → Import</i>. Re-importing later updates events instead of duplicating them.</p>
    <p><b>Auto-sync:</b> once the site is on Vercel (see README), subscribe to its events.ics link.</p>
    <p class="hint">Or open any event and use “Add this event to Google Calendar”.</p>
    <div class="row"><button onclick="$('subDlg').close()">Close</button></div>` : `
    <h2>Subscribe in Google Calendar</h2>
    <p>In Google Calendar: <i>Other calendars → + → From URL</i>, and paste:</p>
    <p><code>${esc(url)}</code></p>
    <p class="hint">Google refreshes subscribed calendars every few hours. Apple Calendar and Outlook accept the same link.</p>
    <div class="row"><button onclick="$('subDlg').close()">Close</button><button class="primary" id="copyIcs">Copy link</button></div>`;
  const c = $("copyIcs"); if (c) c.onclick = () => { navigator.clipboard.writeText(url); toast("Link copied"); };
  $("subDlg").showModal();
};
for (const d of ["eventDlg", "subDlg", "loginDlg"]) $(d).addEventListener("click", ev => { if (ev.target === $(d)) $(d).close(); });

const loginResult = new URLSearchParams(location.search).get("login");
if (loginResult) {
  history.replaceState(null, "", location.pathname);
  setTimeout(() => toast(loginResult === "ok" ? "Logged in" : "That login link expired. Request a new one."), 300);
}

calendar.render();
load().then(setupAuth);
</script>
</body>
</html>
